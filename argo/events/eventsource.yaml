apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: gitlab-webhook
  namespace: fraud-detect
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    # Endpoint appelé par GitLab CI (job trigger-argo-cd)
    fraud-gitlab-push:
      port: "12000"
      endpoint: /fraud-gitlab-push
      method: POST
      # Token partagé avec GitLab CI (variable ARGO_EVENTS_TOKEN)
      authSecret:
        name: argo-events-token
        key: token
