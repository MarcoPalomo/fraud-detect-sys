apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-serving
  namespace: fraud-detect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-serving
  template:
    metadata:
      labels:
        app: fraud-serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: fraud-serving
          image: fraud-detect/serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: PGVECTOR_HOST
              value: pgvector
            - name: PGVECTOR_DB
              value: fraud
            - name: PGVECTOR_USER
              valueFrom:
                secretKeyRef:
                  name: pgvector-secret
                  key: username
            - name: PGVECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgvector-secret
                  key: password
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_SERVICE_NAME
              value: fraud-serving
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-serving
  namespace: fraud-detect
spec:
  selector:
    app: fraud-serving
  ports:
    - name: http
      port: 8000
      targetPort: 8000
