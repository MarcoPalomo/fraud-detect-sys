apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fraud-detect
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        jsonData:
          httpMethod: POST

      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        access: proxy
        jsonData:
          maxLines: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: fraud-detect
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: fraud-detect
        orgId: 1
        folder: "Fraud Detection"
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-fraud
  namespace: fraud-detect
data:
  fraud-overview.json: |
    {
      "title": "Fraud Detection — Overview",
      "uid":   "fraud-overview",
      "time":  {"from": "now-1h", "to": "now"},
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Requêtes de scoring (total)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{
            "expr": "sum(fraud_requests_total)",
            "datasource": {"uid": "prometheus"}
          }]
        },
        {
          "id": 2,
          "title": "Taux de fraude détectée (%)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{
            "expr": "100 * sum(fraud_requests_total{result='fraud'}) / sum(fraud_requests_total)",
            "datasource": {"uid": "prometheus"}
          }]
        },
        {
          "id": 3,
          "title": "Version modèle en service",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 0},
          "targets": [{
            "expr": "fraud_model_version",
            "datasource": {"uid": "prometheus"}
          }]
        },
        {
          "id": 4,
          "title": "Latence scoring (p50 / p95 / p99)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(fraud_request_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50",
              "datasource": {"uid": "prometheus"}
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(fraud_request_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95",
              "datasource": {"uid": "prometheus"}
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(fraud_request_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "datasource": {"uid": "prometheus"}
            }
          ]
        },
        {
          "id": 5,
          "title": "Distribution des scores de risque",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [{
            "expr": "sum(rate(fraud_score_distribution_bucket[5m])) by (le)",
            "legendFormat": "score <= {{le}}",
            "datasource": {"uid": "prometheus"}
          }]
        },
        {
          "id": 6,
          "title": "Alertes fraude envoyées (Kafka)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 12},
          "targets": [{
            "expr": "rate(fraud_consumer_alerts_total[5m])",
            "legendFormat": "alertes/s",
            "datasource": {"uid": "prometheus"}
          }]
        },
        {
          "id": 7,
          "title": "Logs — Erreurs serving",
          "type": "logs",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 18},
          "targets": [{
            "expr": "{app='fraud-serving'} |= 'ERROR'",
            "datasource": {"uid": "loki"}
          }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fraud-detect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-fraud
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-fraud
          configMap:
            name: grafana-dashboard-fraud
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: fraud-detect
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
# Le secret grafana-secret est créé par : make secrets
# Source : variable GRAFANA_PASSWORD dans .env
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fraud-detect
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: fraud-detect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: grafana.fraud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
