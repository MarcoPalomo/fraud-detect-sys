# Ce fichier est intentionnellement vide.
# Le secret argo-events-token est créé par : make secrets
# Source : variable ARGO_EVENTS_TOKEN dans .env
# La même valeur doit être configurée dans GitLab CI → Settings → CI/CD → Variables
#
# Structure du secret créé :
#   kubectl create secret generic argo-events-token \
#     --from-literal=token=<ARGO_EVENTS_TOKEN> \
#     --namespace=fraud-detect
