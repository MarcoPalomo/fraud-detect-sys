[project]
name = "fraud-detect-sys"
version = "0.1.0"
requires-python = ">=3.11"

# =============================================================================
# Ruff — lint + format
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line-length géré par formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert autorisé dans les tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Mypy — type checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["core"]
omit = ["tests/*", "core/serving/gradio_ui.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
