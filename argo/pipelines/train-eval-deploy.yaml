apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fraud-train-eval-deploy
  namespace: fraud-detect
spec:
  entrypoint: pipeline
  serviceAccountName: argo-workflow-sa

  # Paramètres surchargeables au déclenchement
  arguments:
    parameters:
      - name: data-path
        value: /data/transactions.csv
      - name: model-name
        value: fraud-detector
      - name: max-epochs
        value: "50"
      - name: batch-size
        value: "256"
      - name: lr
        value: "0.001"
      - name: pos-weight
        value: "10.0"
      - name: apply-smote
        value: "true"
      - name: f1-promotion-threshold
        value: "0.80"
      - name: image-model
        value: fraud-detect/model:latest
      - name: image-serving
        value: fraud-detect/serving:latest

  templates:
    # -----------------------------------------------------------------------
    # DAG principal : train → eval → (deploy si succès)
    # -----------------------------------------------------------------------
    - name: pipeline
      dag:
        tasks:
          - name: train
            template: train-step

          - name: evaluate
            template: eval-step
            dependencies: [train]
            arguments:
              parameters:
                - name: run-id
                  value: "{{tasks.train.outputs.parameters.run-id}}"

          - name: deploy
            template: deploy-step
            dependencies: [evaluate]
            # N'exécute deploy que si eval s'est terminé avec succès (exit 0)
            when: "{{tasks.evaluate.status}} == Succeeded"

    # -----------------------------------------------------------------------
    # Step 1 : Entraînement
    # -----------------------------------------------------------------------
    - name: train-step
      outputs:
        parameters:
          - name: run-id
            valueFrom:
              path: /tmp/run_id.txt
      container:
        image: "{{workflow.parameters.image-model}}"
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "core.model.train"]
        env:
          - name: DATA_PATH
            value: "{{workflow.parameters.data-path}}"
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow:5000
          - name: MODEL_NAME
            value: "{{workflow.parameters.model-name}}"
          - name: MAX_EPOCHS
            value: "{{workflow.parameters.max-epochs}}"
          - name: BATCH_SIZE
            value: "{{workflow.parameters.batch-size}}"
          - name: LR
            value: "{{workflow.parameters.lr}}"
          - name: POS_WEIGHT
            value: "{{workflow.parameters.pos-weight}}"
          - name: APPLY_SMOTE
            value: "{{workflow.parameters.apply-smote}}"
          - name: RUN_ID_OUTPUT_PATH
            value: /tmp/run_id.txt
        resources:
          requests:
            memory: 2Gi
            cpu: "2"
          limits:
            memory: 4Gi
            cpu: "4"
        volumeMounts:
          - name: data-volume
            mountPath: /data

    # -----------------------------------------------------------------------
    # Step 2 : Évaluation + promotion conditionnelle
    # -----------------------------------------------------------------------
    - name: eval-step
      inputs:
        parameters:
          - name: run-id
      container:
        image: "{{workflow.parameters.image-model}}"
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "core.model.eval"]
        env:
          - name: DATA_PATH
            value: "{{workflow.parameters.data-path}}"
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow:5000
          - name: MODEL_NAME
            value: "{{workflow.parameters.model-name}}"
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: F1_PROMOTION_THRESHOLD
            value: "{{workflow.parameters.f1-promotion-threshold}}"
        resources:
          requests:
            memory: 1Gi
            cpu: "1"
          limits:
            memory: 2Gi
            cpu: "2"
        volumeMounts:
          - name: data-volume
            mountPath: /data

    # -----------------------------------------------------------------------
    # Step 3 : Déploiement (rollout du Deployment serving)
    # -----------------------------------------------------------------------
    - name: deploy-step
      resource:
        action: patch
        mergeStrategy: merge
        manifest: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: fraud-serving
            namespace: fraud-detect
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{workflow.creationTimestamp}}"

  # Volumes partagés entre les steps
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: fraud-data-pvc
---
# ServiceAccount minimal pour que Argo puisse patcher le Deployment
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow-sa
  namespace: fraud-detect
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-role
  namespace: fraud-detect
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-rolebinding
  namespace: fraud-detect
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: fraud-detect
roleRef:
  kind: Role
  name: argo-workflow-role
  apiGroup: rbac.authorization.k8s.io
---
# PVC pour les données d'entraînement
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fraud-data-pvc
  namespace: fraud-detect
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
